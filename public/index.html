    <h2 id="rulesTitle">101 OKEY KURALLARI<ch2>
    <ul>
      <li>Başlayana 22, diğerlerine 21 taş dağıtılır; başlayan oyuncu bir taş atarak başlar.<cli>
      <li>Seri (aynı renk ardışık) ve per (aynı sayı farklı renk) toplamı en az 101 ise seri açılır; en az 5 çiftle çift açılır. Okey çiftte joker olur: herhangi bir taşın yanına konunca çift sayılır.<cli>
      <li>Açtıktan sonra masadaki gruplara taş işlenebilir (sürükleyip bırak); bir sete bir turda en fazla 2 taş işlenir.<cli>
      <li>Soldan taş alan oyuncu o taşı aynı turda açılışta veya işlemede kullanmalıdır. Geri bırakılan taş aynı tur tekrar alınamaz.<cli>
      <li>İşlenebilir taş atmak, okey atmak ve hatalı açmak 101 cezadır.<cli>
      <li>12-13-1 geçerli değildir. Elde kalan okey 101 sayılır; en düşük toplam puan kazanır.<cli>
      <li>Katlamalı masada sonraki açılış öncekinden en az 1 puan (çiftte 1 çift) fazla olmalıdır.<cli>
    <cul>
