<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Alemdar Kıraathanesi</title>
<style>
  html, body { margin: 0; height: 100%; background: #14101c; color: #f3e9d2; font-family: "Segoe UI", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; max-width: 420px; padding: 32px; }
  h1 { font-size: 26px; margin: 0 0 12px; color: #e8b54a; letter-spacing: .5px; }
  p { margin: 0 0 22px; opacity: .8; line-height: 1.5; }
  button { background: #e8b54a; color: #1d1408; border: 0; border-radius: 8px; padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #f2c564; }
</style>
</head>
<body>
  <div class="box">
    <h1>Alemdar Kıraathanesi</h1>
    <p>Sunucuya bağlanılamadı. İnternet bağlantını kontrol edip tekrar dene.</p>
    <button onclick="window.alemdar && window.alemdar.retry()">TEKRAR DENE</button>
  </div>
</body>
</html>
