<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Alemdar Kıraathanesi</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1c1e; color: #f4f1ea; font-family: "Segoe UI", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; }
  b { font-size: 30px; letter-spacing: 6px; }
  small { color: #e3b04b; letter-spacing: 6px; font-size: 12px; margin-top: -12px; }
  .bar { width: 220px; height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: #e3b04b; animation: go 1.1s ease-in-out infinite; }
  @keyframes go { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>
</head>
<body><b>ALEMDAR</b><small>KIRAATHANESİ</small><div class="bar"><i></i></div></body>
</html>
