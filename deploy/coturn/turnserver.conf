# Alemdar Kıraathanesi: sesli/görüntülü sohbet için TURN sunucusu (coturn).
# Oyun sunucusunda aynı sırrı ver: TURN_SECRET=<aşağıdaki static-auth-secret>
#                                TURN_URLS=turn:turn.ALANADI:3478,turn:turn.ALANADI:3478?transport=tcp
# Güvenlik duvarında açılmalı: 3478 UDP/TCP ve 49152-65535 UDP.
listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=BURAYA_UZUN_RASTGELE_BIR_SIR_YAZ
realm=alemdar
total-quota=200
bps-capacity=0
stale-nonce=600
min-port=49152
max-port=65535
no-multicast-peers
no-cli
# Özel ağlara aktarım yapılmasın (kötüye kullanım koruması)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
